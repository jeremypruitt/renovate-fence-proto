# Self-hosted Renovate with a token from this repository's own GitHub App.
# The app's key lives in the renovate environment, which only main can use,
# so a pull request's workflow can't read it. The token is minted for this
# repository only and lasts an hour. A ruleset keeps the app to renovate/**.
name: renovate
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency: renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: renovate
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        id: app
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-issues: write
      - name: renovate
        env:
          RENOVATE_TOKEN: ${{ steps.app.outputs.token }}
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          RENOVATE_GIT_AUTHOR: ${{ vars.RENOVATE_GIT_AUTHOR }}
        run: |
          docker run --rm \
            -e RENOVATE_TOKEN -e RENOVATE_REPOSITORIES -e RENOVATE_GIT_AUTHOR \
            -e RENOVATE_PLATFORM=github -e RENOVATE_ONBOARDING=false \
            -e RENOVATE_REQUIRE_CONFIG=required -e RENOVATE_PLATFORM_COMMIT=enabled \
            -e RENOVATE_FORCE='{"schedule":["at any time"],"prHourlyLimit":0}' \
            -e LOG_LEVEL=info \
            ghcr.io/renovatebot/renovate@sha256:2bae955368b05fa2da61d4c813b92251fde0abc59b3e488f2f2cb3672da76cc2
